<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Doomscroll Together player</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}iframe{position:absolute;inset:0;width:100%;height:100%;border:0}</style>
</head>
<body>
<script>
// Doomscroll Together runs inside Root, where YouTube can't see which site is embedding it
// (YouTube then shows "Error 153"). This page hosts the official YouTube player from a normal
// web address and passes the App's play/pause/seek/mute messages straight through, both ways.
(function () {
  var q = new URLSearchParams(location.search);
  var id = (q.get("v") || "").replace(/[^A-Za-z0-9_-]/g, "").slice(0, 11);
  if (!id) return;
  var p = new URLSearchParams({
    autoplay: "1",
    mute: q.get("mute") === "0" ? "0" : "1",
    playsinline: "1",
    rel: "0",
    modestbranding: "1",
    enablejsapi: "1",
    origin: location.origin
  });
  if (q.get("loop") === "1") { p.set("loop", "1"); p.set("playlist", id); }
  var start = parseInt(q.get("start") || "0", 10);
  if (start > 0) p.set("start", String(start));
  var f = document.createElement("iframe");
  f.src = "https://www.youtube.com/embed/" + id + "?" + p.toString();
  f.title = "YouTube video player";
  f.allow = "autoplay; encrypted-media; fullscreen; picture-in-picture";
  f.referrerPolicy = "strict-origin-when-cross-origin";
  f.allowFullscreen = true;
  document.body.appendChild(f);
  window.addEventListener("message", function (e) {
    if (e.source === f.contentWindow) {
      if (window.parent !== window) window.parent.postMessage(e.data, "*");
    } else if (e.source === window.parent && f.contentWindow) {
      f.contentWindow.postMessage(e.data, "https://www.youtube.com");
    }
  });
})();
</script>
</body>
</html>
